name: Keep Render site awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      KEEP_AWAKE_UNTIL: "2026-12-01T18:20:00Z"
      SITE_URL: "https://pallab-papiya-save-the-date.onrender.com/"
    steps:
      - name: Stop the scheduled monitor after 30 days
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$(date -u +%s)" -ge "$(date -u -d "$KEEP_AWAKE_UNTIL" +%s)" ]]; then
            gh workflow disable keep-render-awake.yml
            echo "The 30-day keep-awake period has ended."
            exit 0
          fi

      - name: Ping the Render site
        run: curl --fail --silent --show-error --max-time 45 "$SITE_URL"
